function chart(){let curr=[198,212,188,205,171,140,122],prev=[180,195,192,205,198,206,204];if(S.period==='近14天'){curr=curr.concat(curr);prev=prev.concat(prev)}if(chartMode==='核销金额'){curr=curr.map(v=>v*864/1236);prev=prev.map(v=>v*950/1380)}let d=getD(),f=d.factor,top=chartMode==='核销金额'?180:250;const pts=a=>a.map((v,i)=>`${50+i*530/(a.length-1)},${205-v/top*170}`).join(' ');return `<svg class="chart" viewBox="0 0 610 242" role="img" aria-label="${chartMode}趋势，当前周期及上一等长周期，演示数据"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a48fe8" stop-opacity=".23"/><stop offset="1" stop-color="#a48fe8" stop-opacity=".01"/></linearGradient></defs>${[0,1,2,3,4].map(i=>`<line x1="50" y1="${205-i*42.5}" x2="580" y2="${205-i*42.5}" stroke="#eeedf4" stroke-dasharray="3 3"/><text x="0" y="${209-i*42.5}">${Math.round(top*i/4*f)}</text>`).join('')}<text x="0" y="14">万元</text><polygon points="50,205 ${pts(curr)} 580,205" fill="url(#fill)"/><polyline points="${pts(prev)}" fill="none" stroke="#bfc6d8" stroke-width="2" stroke-dasharray="5 5"/><polyline points="${pts(curr)}" fill="none" stroke="#8d6ddd" stroke-width="2.8"/>${curr.map((v,i)=>`<circle cx="${50+i*530/(curr.length-1)}" cy="${205-v/top*170}" r="3" fill="#fff" stroke="#8d6ddd"><title>第${i+1}天：${(v*f).toFixed(1)}万元（演示）</title></circle>`).join('')}${[0,2,4,6].map((i)=>`<text x="${42+i*530/6}" y="232">${S.period==='近7天'?'09/'+String(9+i).padStart(2,'0'):'第'+(1+i*2)+'天'}</text>`).join('')}</svg>`}
function kpis(){let d=getD();return `<div class="grid cols4">${[['支付金额',money(d.pay),'万元','↓ 10.4%','bad','支付成功发生日'],['核销金额',money(d.verify),'万元','↓ 9.1%','bad','核销成功发生日'],['动销商家',d.merchants.toLocaleString(),'家','↑ 3.2%','good','周期内去重商家'],['7日退款率','4.8','%','↑ 0.7pp','bad','已成熟支付队列']].map((x,i)=>`<div class="card kpi"><div class="between"><span class="label">${x[0]}</span><button class="textbtn muted" aria-label="查看${x[0]}定义" onclick="metricInfo()">ⓘ</button></div><div class="value">${x[1]}<small>${x[2]}</small></div><div class="bottom"><span class="${x[4]}">${x[3]}</span> <span>较上一周期</span></div><div class="small muted" style="margin-top:7px;font-size:10px">${x[5]}</div><svg class="sparkline" viewBox="0 0 65 30"><path d="${i===2?'M1 28 12 22 20 25 31 16 43 18 54 8 64 4':'M1 7 12 9 20 5 31 15 43 12 54 23 64 26'}" fill="none" stroke="${i===2?'#63b7a4':'#b29cec'}" stroke-width="2"/></svg></div>`).join('')}</div>`}

tyle="justify-content:flex-start;font-size:12px;padding:13px 10px" onclick="go('${x[2]}')">${ic(x[0])}${x[1]}</button>`).join('')}</div><p class="note">已审核模板优先复用，分析过程与结论统一留痕。</p>`)}</div>`}

function dataPage(){return head('数据生产','让口径、质量与权限先于每一次分析。',`<button class="primary" onclick="pipeline()">${ic('plus')} 新建数据任务</button>`)+`<div class="banner"><div class="spark">${ic('shield')}</div><div><strong>${S.quality?'当前演示数据可用于分析':'数据延迟：暂停生成新结论'}</strong><p>${S.quality?'5 项质量检查通过 · 演示快照 2026-09-16 08:30 · 时区 Asia/Shanghai':'交易分区尚未完成更新。已有报告保留快照，新诊断与报告生成被阻止。'}</p></div><button onclick="S.quality=!S.quality;S.diagnosed=false;persist();render()">${S.quality?'模拟数据延迟':'模拟修复并重检'}</button></div><div class="grid maincols">${card('数据资产',`<div class="tablewrap section-gap"><table><thead><tr><th>资产名称</th><th>粒度</th><th>状态</th><th>详情</th></tr></thead><tbody>${[['交易主题宽表','订单 × 日','演示可用'],['商家成长特征','商家 × 日','演示可用'],['核销与退款事件','券 × 事件','演示可用'],['实验分流日志','实验 × 随机单元','待对接']].map((x,i)=>`<tr><td>${x[0]}<span class="sub">${i===3?'尚未连接真实系统':'本地合成数据 · 建议资产'}</span></td><td>${x[1]}</td><td>${tag(i===0&&!S.quality?'延迟':x[2],i===3?'amber':i===0&&!S.quality?'red':'green')}</td><td><button class="textbtn" onclick="assetDetail(${i})">查看</button></td></tr>`).join('')}</tbody></table></div>`)}${card('质量闸门',`<div class="timeline">${[['数据新鲜度',S.quality?'通过 · 演示':'阻断 · 分区延迟'],['主键与重复','通过 · 订单 / 券粒度分离'],['完整性','通过 · 核心字段空值检查'],['关联覆盖','通过 · 商家与门店映射'],['业务对账','通过 · 撤销与退款去重']].map((x,i)=>`<div><div class="between"><b class="small">${x[0]}</b><span class="${i===0&&!S.quality?'bad':'good'} small">${x[1]}</span></div></div>`).join('')}</div><button class="full" onclick="pipeline()">查看数据处理流程</button>`)}</div><div class="grid cols3 section-gap">${[['1','提取与授权','只读查询、行列权限与扫描预算'],['2','清洗与加工','去重、映射、缺失处理与质量检查'],['3','发布与复用','人工评审后发布版本，变更影响可追踪']].map(x=>card(x[0]+' · '+x[1],`<p class="subtitle">${x[2]}</p>`)).join('')}</div>`}
function diagnosis(){let d=getD();return head('异动诊断','先确认变化真实发生，再分解驱动，最后设计验证。')+`<div class="card"><div class="between"><div class="row">${tag('交易效率')}<h2>餐饮支付金额下降</h2><span class="small muted">${context()}</span></div><button class="primary" id="runDiagnosis" onclick="runDiagnosis()" ${!S.quality?'disabled':''}>${ic('spark')}${S.diagnosed?'重新诊断':'运行 AI 诊断'}</button></div><div class="steps">${[['01','口径与数据校验'],['02','规模与结构分解'],['03','证据交叉验证'],['04','策略与验证方案']].map((x,i)=>`<div class="step ${S.diagnosed||i===0?'done':''}"><b>${x[0]} ${x[1]}</b>${S.diagnosed?'演示分析已完成':i===0?(S.quality?'数据检查通过':'数据延迟，需修复'):'等待运行'}</div>`).join('')}</div>${!S.quality?`<div class="callout bad">质量闸门未通过。<button class="textbtn" onclick="go('data')">前往数据生产修复</button></div>`:''}</div><div class="grid maincols section-gap">${card('异动证据',`<div class="tabs section-gap">${['变化贡献','趋势对比','候选假设'].map(x=>`<button class="${diagnosisTab===x?'active':''}" onclick="diagnosisTab='${x}';render()">${x}</button>`).join('')}</div>${diagnosisTab==='趋势对比'?chart():diagnosisTab==='候选假设'?`<div class="evidence"><b>H1 · 晚间供给减少影响支付转化</b><p class="subtitle">需补充：可售库存、营业时段和流量结构。当前无因果结论。</p>${tag('待验证','amber')}</div><div class="evidence"><b>H2 · 促销退坡改变客群结构</b><p class="subtitle">需补充：活动排期、价格与补贴变化；对照组检验共同趋势。</p>${tag('待验证','amber')}</div>`:`<p class="small muted">分解口径：互斥时段的支付金额差额 / 总差额。不是因果归因。</p>${[['晚间 18:00–24:00',72],['午间 11:00–14:00',18],['其他时段',10]].map(x=>`<div class="barrow"><span>${x[0]}</span><div class="bar"><i style="width:${x[1]}%"></i></div><span>${x[1]}%</span></div>`).join('')}<div class="evidence between"><span>周期差额 <b class="bad">−${money(d.delta)} 万元</b></span><span class="small">晚间差额 −${money(d.delta*.72)} 万元</span></div><p class="note">全国合成样本按固定地域比例切片，仅用于展示筛选联动。</p>`}`)}${card(S.diagnosed?'AI 诊断摘要':'诊断任务说明',S.diagnosed?`<div class="section-gap">${tag('描述性发现','purple')}<h3 style="margin:14px 0">晚间时段解释了 72% 的金额下降</h3><p class="small">支付金额从 ${money(d.prev)} 万元降至 ${money(d.pay)} 万元。晚间时段贡献最大，但尚不能判断供给、流量或活动变化是否为原因。</p><div class="divider"></div><div class="row small good">${ic('check')} 口径版本 metric_demo_v1</div><div class="row small good" style="margin-top:8px">${ic('check')} 同期长度一致，演示质量校验通过</div><p class="note">缺失证据：活动、库存、曝光与访问日志。结论等级不能升为“因果确认”。</p><button class="primary full section-gap" onclick="newProject()">创建专题分析 ${ic('arrow')}</button><button class="full" style="margin-top:9px" onclick="evidenceDetail()">查看证据与复算说明</button></div>`:`<p class="section-gap small">运行后查看完整的分析摘要、证据清单和专题入口。左侧为演示数据预览。</p><div class="timeline"><div><b class="small">识别变化</b><p class="subtitle">比较相同业务口径与等长周期。</p></div><div><b class="small">寻找驱动</b><p class="subtitle">分解地域、商家层级、渠道、时段。</p></div><div><b class="small">提出验证</b><p class="subtitle">交由分析师评审，补齐外部证据。</p></div></div>` )}</div>`}
async function runDiagnosis(){if(!S.quality){toast('数据质量未通过，请先修复');return}let button=document.getElementById('runDiagnosis');button.disabled=true;button.innerHTML='正在核对演示证据…';await new Promise(r=>setTimeout(r,800));S.diagnosed=true;persist();render();toast('演示诊断完成：发现已生成，因果假设仍需验证')}
function projects(){return head('专题分析','从业务问题到策略复盘，在一个项目中完成闭环。',`<button class="primary" onclick="newProject()">${ic('plus')} 新建专题</button>`)+`<div class="grid cols3">${[['问题拆解','确定分析目标、假设与证据缺口'],['协同评审','评审结论强度与建议可执行性'],['跟进复盘','跟踪负责人、观察窗口与护栏']].map((x,i)=>card(`0${i+1} · ${x[0]}`,`<p class="subtitle">${x[1]}</p>`)).join('')}</div><div class="section-gap">${card('项目列表',projectTable())}</div>${S.project?`<div class="grid maincols section-gap">${card(esc(S.project.name),`<div class="section-gap callout">${esc(S.project.question)}</div><div class="info-grid"><div><label>负责人</label>${esc(S.project.owner)}</div><div><label>复盘日期</label>${esc(S.project.date)}</div><div><label>分析范围（创建时快照）</label>${esc(S.project.scope)}</div><div><label>当前阶段</label>${S.report?'报告草稿待评审':'证据补充与策略拆解'}</div></div><div class="between section-gap"><button onclick="projectDetail()">编辑策略与行动项</button><button class="primary" onclick="makeReport()" ${!S.quality?'disabled':''}>生成报告草稿 ${ic('arrow')}</button></div>`)}${card('下一步行动',`<div class="checklist">${['补齐晚间可售供给与曝光证据','核查促销与补贴排期变化','选择实验或准实验验证方法'].map((x,i)=>`<label><input type="checkbox" ${S.project.checks?.[i]?'checked':''} onchange="S.project.checks[${i}]=this.checked;persist()">${x}</label>`).join('')}</div><div class="reviewstamp">${esc(S.project.strategy||'建议在匹配门店中验证晚间供给补齐；以核销收益为结果，退款与投诉为护栏。')}</div><button class="textbtn section-gap" onclick="go('experiments')">进入实验设计 →</button>`)}</div>`:`<div class="section-gap callout">从异动诊断创建专题，将自动带入指标、筛选范围与证据快照；也可以手动新建。</div>`}`}
function chatPage(){return head('智能问答','一句话提出问题，每一条回答都携带口径、数据来源和证据。',`<button onclick="chatMessages=[];render()">新对话</button>`)+`<div class="chat-layout"><section class="card chat-box"><div id="messages">${chatMessages.length?chatMessages.map(m=>`<div class="message ${m.role}">${m.role==='user'?`<p>${esc(m.text)}</p>`:`<div class="row good small">${ic('spark')} 观澜 AI · 示例答案</div>${m.html}`}</div>`).join(''):`<div class="chat-empty"><div class="mark">≈</div><h2 style="font-size:24px">今天，想从数据里发现什么？</h2><p class="subtitle">先明确业务问题，再核对指标口径，最后看证据。</p><div class="suggestions">${['为什么餐饮支付金额下降？','哪些商家值得优先运营？','退款率上升如何排查？'].map(x=>`<button onclick="question('${x}')">${x}</button>`).join('')}</div></div>`}</div><form class="composer" onsubmit="event.preventDefault();ask(document.getElementById('prompt').value)"><textarea id="prompt" aria-label="输入分析问题" placeholder="例如：近7天餐饮支付金额为什么下降？" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea><div class="between"><span class="small muted">${context()} · 演示问答</span><button class="primary" type="submit">发送 ${ic('arrow')}</button></div></form></section>${card('本次分析上下文',`<div class="section-gap"><label>业务范围</label><b>${S.city} / 餐饮 / ${S.period}</b><div class="divider"></div><label>可用资产</label><p class="small">交易主题宽表<br>商家成长特征<br>核销与退款事件</p><div class="divider"></div><label>口径版本</label><button class="textbtn" onclick="metricInfo()">metric_demo_v1 →</button><div class="divider"></div><label>回答规则</label><p class="small muted">只使用已授权资产；展示生成的查询逻辑；证据不足时提出补充问题；不把相关性写成因果。</p><p class="note">本原型仅提供预设示例答案，尚未接入大模型或真实数据库。</p></div>`)}</div>`}
function question(q){if(route!=='chat'){go('chat');setTimeout(()=>ask(q),20)}else ask(q)}
function ask(q){q=q.trim();if(!q){toast('请先输入分析问题');return}if(!S.quality){toast('数据延迟，暂不能生成新回答。请到数据生产修复。');return}chatMessages.push({role:'user',text:q});let html;if(/退款/.test(q))html='<p>建议按支付队列比较成熟后的 7 日退款率，再分解退款原因、行业、商家层级与核销状态。演示队列退款率为 4.8%，上期 4.1%，增加 0.7 个百分点。</p><p class="muted small">需要补充退款原因和投诉日志；当前不能认定服务质量下降是根因。</p>';else if(/商家|分层/.test(q))html='<p>建议按“新入驻未首单、低频动销、稳定成长、高价值”建立互斥商家层级，再对比首单、留存和核销表现。</p><p class="muted small">分层阈值与观察窗需要按业务校准，当前尚无真实商家可推荐。</p><button class="textbtn" onclick="S.model=\'商家分层\';go(\'models\')">进入建模实验室 →</button>';else if(/下降|支付|交易|异动/.test(q)){let d=getD();html=`<p>在 ${esc(context())} 的演示样本中，支付金额为 <b>${money(d.pay)} 万元</b>，较上一周期下降 <b>10.4%</b>。晚间时段解释了差额的 72%。</p><p class="muted small">这是互斥时段的金额变化贡献，不是供给或流量的因果效应。</p><button class="primary" onclick="go('diagnosis')">进入异动诊断</button>`}else html='<p>本原型尚未接入真实 AI，无法可靠回答这个问题。请先明确业务指标、观察周期和比较对象，或使用上方三个示例问题体验。</p>';chatMessages.push({role:'ai',html:html+`<div class="evidence small">来源：合成交易样本 / metric_demo_v1 / 2026-09-16 快照 <button class="textbtn small" onclick="evidenceDetail()">查看证据</button></div>`});render();document.getElementById('prompt').focus()}
function models(){return head('建模实验室','选择业务场景，复用分析方法，让每次建模都可解释、可复算。',`<button onclick="go('library')">查看能力矩阵</button>`)+`<div class="grid cols4">${[['商家分层','生命周期 + 经营强度','优先服务谁'],['需求预测','季节性基线 + 滚动回测','未来需求在哪里'],['效果归因','转化路径 + 增量检验','增长从哪里来'],['因果分析','实验 / 双重差分 / 加权','策略是否有效']].map(x=>`<button class="option-card ${S.model===x[0]?'selected':''}" onclick="S.model='${x[0]}';modelRun=false;persist();render()"><div class="model-icon">${ic('model')}</div><h2>${x[0]}</h2><p>${x[1]}</p><span class="tag" style="margin-top:12px">${x[2]}</span></button>`).join('')}</div><div class="grid maincols section-gap">${card(S.model+' · 分析配置',`<div class="formgrid section-gap"><div><label>分析对象</label><select id="modelUnit" onchange="modelUnit=this.value"><option>${S.model==='商家分层'?'商家':S.model==='需求预测'?'城市 × 行业 × 日':S.model==='因果分析'?'门店 × 周':'用户转化路径'}</option>${S.model==='商家分层'?'<option '+(modelUnit==="用户"?"selected":"")+'>用户</option>':''}</select></div><div><label>观察窗口</label><select id="modelWindow" onchange="modelWindow=this.value"><option ${modelWindow==='过去 28 天'?'selected':''}>过去 28 天</option><option ${modelWindow==='过去 56 天'?'selected':''}>过去 56 天</option></select></div><div><label>目标指标</label><select><option>${S.model==='商家分层'?'动销 / 核销 / 留存':S.model==='需求预测'?'支付订单量':'增量核销金额'}</option></select></div><div><label>结果用途</label><select onchange="modelPurpose=this.value"><option ${modelPurpose==='分析师评审'?'selected':''}>分析师评审</option><option ${modelPurpose==='策略方案评审'?'selected':''}>策略方案评审</option></select></div></div><div class="evidence"><b class="small">${S.model==='商家分层'?'先从可解释分层开始':S.model==='需求预测'?'预测必须与简单基线比较':S.model==='效果归因'?'渠道贡献不等于渠道增量':'因果结论必须满足识别条件'}</b><p class="small muted">${S.model==='商家分层'?'新入驻先按生命周期互斥分组，再在成熟商家内按经营强度分层。检查样本覆盖与稳定性，避免把重叠标签当成可加总分组。':S.model==='需求预测'?'按时间切分，使用历史时点可见特征；滚动回测季节性基线，输出预测区间与节假日情景，防止未来信息泄漏。':S.model==='效果归因'?'先定义触点、身份去重、回溯窗口与归因规则。归因模型描述分配，策略增量仍需实验或准实验验证。':'随机实验优先。非随机策略需检验共同趋势、重叠性和干扰，评估未观测混杂；条件不满足时仅保留关联分析。'}</p></div><button class="primary" onclick="modelUnit=document.getElementById('modelUnit').value;modelWindow=document.getElementById('modelWindow').value;modelRun=true;render();toast('已生成预设方法示例，未执行真实模型训练')" ${!S.quality?'disabled':''}>预览分析方案</button>`)}${card(modelRun?'方法预览 · 演示':'评估与交付标准',modelRun?`<div class="section-gap">${tag('方法草稿','amber')}<h3 style="margin-top:15px">${S.model}方案已生成</h3><p class="subtitle">分析对象：${esc(modelUnit)} · ${esc(modelWindow)}<br>用途：${esc(modelPurpose)}<br>输入：建议主题资产<br>输出：${S.model==='商家分层'?'互斥分群、特征对比与行动建议':S.model==='需求预测'?'滚动回测、误差与预测区间':S.model==='效果归因'?'路径分解、规则敏感性与增量验证':'效应估计、识别假设与稳健性检验'}</p><div class="divider"></div><p class="small">没有真实数据，本页不展示训练准确率、预测数值或因果提升。</p><button class="full section-gap" onclick="newProject()">加入专题项目</button></div>`:`<div class="timeline"><div><b>明确比较基线</b><p class="subtitle">业务规则 / 季节性基线 / 对照组</p></div><div><b>检验有效性</b><p class="subtitle">覆盖、漂移、泄漏与外推边界</p></div><div><b>输出业务行动</b><p class="subtitle">目标人群、策略、预期方向与复盘计划</p></div></div>`)}</div>`}
function experiments(){return head('A/B 实验','在结果出现之前，确定假设、随机单元、主指标和停止规则。',`<button class="primary" onclick="experimentPlan()">${ic('plus')} 设计实验</button>`)+`<div class="banner"><div class="spark">${ic('flask')}</div><div><strong>晚间可售供给补齐 · 实验方案示例</strong><p>建议按门店随机分组，并评估商圈干扰；真实实验尚未创建或投放。</p></div>${tag('待评审','amber')}</div><div class="grid cols3">${card('主指标',`<h3 class="section-gap">门店增量核销金额</h3><p class="subtitle">随机单元聚合后估计，不能把订单当独立样本。</p>`)}${card('护栏指标',`<h3 class="section-gap">退款率 · 投诉率 · 补贴成本</h3><p class="subtitle">阈值、观察窗口及成本定义待业务确认。</p>`)}${card('结论闸门',`<h3 class="section-gap">分流 → 成熟 → 护栏 → 收益</h3><p class="subtitle">SRM 异常时暂停效果解读；不按单次显著提前停止。</p>`)}</div><div class="grid maincols section-gap">${card('样本量估算器 · 二项转化指标',`<p class="note">独立随机单元近似；双侧 95% 置信度 / 80% 功效 / 1:1 分流。不是上述核销金额实验的样本量。</p><div class="formgrid section-gap"><div><label>基线转化率（%）</label><input id="baseline" type="number" value="20" min=".1" max="99" step=".1"></div><div><label>最小可检测绝对提升（百分点）</label><input id="mde" type="number" value="1" min=".01" max="50" step=".1"></div><div><label>每天总可入组随机单元数</label><input id="traffic" type="number" value="5000" min="1"></div><div><label>设计效应（聚类时需估计）</label><input id="deff" type="number" value="1" min="1" step=".1"></div></div><button class="primary section-gap" onclick="calcSample()">计算建议样本量</button><div id="sampleResult" class="evidence">输入后计算；建议时长还需覆盖完整业务周期和结果成熟时间。</div>`)}${card('实验评审清单',`<div class="checklist">${['主指标、MDE 与护栏已预注册','随机单元与商圈干扰已评估','样本比例与日志一致性通过','样本量与观察窗均已满足','多重检验与停止规则已确定'].map((x,i)=>`<label><input type="checkbox" aria-label="${x}">${x}</label>`).join('')}</div><p class="note">勾选仅用于本地方案检查，不会执行真实分流。</p><button class="full" onclick="modal('评审结论', '<p>当前没有接入真实实验数据，无法给出效果结论。请补充实验分流日志、指标观测、结果成熟窗口和护栏阈值后再评估。</p>')">查看评审条件</button>`)}</div>`}
function calcSample(){let p=+document.getElementById('baseline').value/100,d=+document.getElementById('mde').value/100,t=+document.getElementById('traffic').value,e=+document.getElementById('deff').value;if(!(p>0&&p<1&&d>0&&p+d<1&&t>0&&e>=1)){toast('请填写有效参数，且基线加提升必须小于100%');return}let p2=p+d,pbar=(p+p2)/2,n=Math.ceil(((1.96*Math.sqrt(2*pbar*(1-pbar))+.84*Math.sqrt(p*(1-p)+p2*(1-p2)))**2/d**2)*e);document.getElementById('sampleResult').innerHTML=`<b>每组约 ${n.toLocaleString()} 个随机单元</b><p>总计 ${(2*n).toLocaleString()} 个；仅按入组流量估计至少 ${Math.ceil(2*n/t)} 天。</p><p class="small muted">假设：固定样本、独立同分布、正态近似；稀有事件与聚类需进一步仿真。非上线承诺。</p>`}
function reports(){return head('报告中心','自动形成初稿，人工审核后沉淀结论，周期复盘可追踪。',`<button class="primary" onclick="makeReport()" ${!S.quality?'disabled':''}>${ic('spark')} 生成专题报告</button>`)+`<div class="grid cols3">${card('专题分析报告',`<p class="subtitle">问题 → 证据 → 结论 → 行动 → 复盘</p><button class="textbtn section-gap" onclick="${S.report?'reportPreview()':'makeReport()'}">${S.report?'查看当前草稿':'从当前专题生成'} →</button>`)}${card('经营周报',`<p class="subtitle">商家增长 / 交易效率 / 生态健康</p><button class="textbtn section-gap" onclick="scheduleModal()">设置自动化任务 →</button>`)}${card('策略复盘报告',`<p class="subtitle">实际结果 / 归因强度 / 护栏 / 迭代</p><button class="textbtn section-gap" onclick="reviewModal()">填写复盘记录 →</button>`)}</div><div class="section-gap">${card('报告与任务',`<div class="tablewrap section-gap"><table><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody>${S.report?`<tr><td>${esc(S.project.name)} · 分析报告<span class="sub">保留创建时范围和演示证据</span></td><td>专题报告</td><td>${tag(S.reviewed?'本地已评审':'待人工评审',S.reviewed?'green':'amber')}</td><td><button class="textbtn" onclick="reportPreview()">查看与导出</button></td></tr>`:''}${S.schedule?`<tr><td>生活服务经营周报<span class="sub">每周一 09:00 · Asia/Shanghai</span></td><td>自动化配置</td><td>${tag('仅本地配置','amber')}</td><td><button class="textbtn" onclick="scheduleModal()">修改配置</button></td></tr>`:''}${!S.report&&!S.schedule?'<tr><td colspan="4"><div class="empty">还没有报告。先完成诊断并创建专题，或配置周报模板。</div></td></tr>':''}</tbody></table></div>`)}</div><p class="note">原型支持本地草稿和文件下载；未连接消息平台、调度系统或外部收件人。</p>`}
function library(){return head('能力资产库','把一次有效分析，变成团队下一次可以复用的方法。',`<button onclick="go('models')">使用分析模板</button>`)+`<div class="banner"><div class="spark">${ic('book')}</div><div><strong>AI 数据分析能力矩阵</strong><p>以业务任务组织方法、输入资产、质量闸门和标准交付；评审后才能进入团队复用。</p></div>${tag('版本化管理')}</div>${card('能力全景',`<div class="tablewrap section-gap"><table class="matrix"><thead><tr><th>能力场景</th><th>AI 嵌入点</th><th>质量与方法约束</th><th>标准输出</th><th>入口</th></tr></thead><tbody>${[['数据生产','提取 / 清洗 / 质量规则','只读授权、粒度、对账','可信主题资产','data'],['智能问答','问题澄清 / 查询草稿','指标语义层、证据引用','可追溯答案','chat'],['异动诊断','维度扫描 / 假设生成','贡献加总、历史对照','诊断卡与证据','diagnosis'],['商家 / 用户分层','分群方案 / 特征解释','互斥性、覆盖、稳定性','人群与策略建议','models'],['需求预测','基线推荐 / 情景解释','时间切分、回测、区间','需求预测方案','models'],['效果归因 / 因果','识别方案 / 稳健性检查','归因与增量区分','效应与适用边界','models'],['实验评估','方案草稿 / 指标解读','SRM、功效、成熟窗口','实验评审材料','experiments'],['报告与复盘','报告草稿 / 行动跟踪','人审、快照、护栏','报告与复用模板','reports']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><button class="textbtn" onclick="go('${x[4]}')">打开</button></td></tr>`).join('')}</tbody></table></div>`)}<div class="grid cols3 section-gap">${[['异动诊断标准模板','metric_demo_v1 · 示例方法','diagnosis'],['商家生命周期分层','方法草稿 · 待阈值校准','models'],[S.savedAsset?'已归档：专题分析方法':'专题方法沉淀','评审 → 版本 → 复用 → 退役','reports']].map(x=>card(x[0],`<p class="subtitle">${x[1]}</p><button class="textbtn section-gap" onclick="go('${x[2]}')">查看资产 →</button>`)).join('')}</div>`}
let lastFocus=null;function modal(title,body,actions='',wide=false){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal ${wide?'wide':''}"><div class="between"><h2>${title}</h2><button class="quiet" onclick="closeModal()" aria-label="关闭">${ic('close')}</button></div><div class="section-gap">${body}</div>${actions?`<div class="actions">${actions}</div>`:''}</section></div>`;document.querySelector('.modal input,.modal textarea,.modal button')?.focus()}
function closeModal(){document.getElementById('overlay').innerHTML='';lastFocus?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();searchModal()}if(e.key==='Tab'&&document.querySelector('.modal')){let a=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea,.modal a')].filter(x=>!x.disabled),first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function metricInfo(){modal('指标口径 · 建议定义',`<p class="muted small">metric_demo_v1 · 非抖音官方内部口径 · 待业务指标负责人评审</p><table class="section-gap"><thead><tr><th>指标</th><th>建议统计方式</th></tr></thead><tbody><tr><td>支付金额</td><td>按支付成功时间汇总用户实际支付金额；不等同于核销或结算金额。退款单独统计。</td></tr><tr><td>核销金额</td><td>按核销发生时间汇总已核销券分摊实付金额；撤销核销按事件去重冲回。</td></tr><tr><td>动销商家</td><td>周期内至少一笔有效支付订单的去重商家数；商家与门店不可混用。</td></tr><tr><td>7日退款率</td><td>同一支付队列中7日内发生成功退款的订单数 / 该支付队列订单数；仅展示观察窗已成熟队列。</td></tr></tbody></table><p class="note">支付与核销的发生日不同，不能直接用当期核销金额 / 当期支付金额解释核销转化率。当前退款示例使用更早已成熟队列，非当期交易队列。</p>`, `<button class="primary" onclick="closeModal()">了解口径</button>`,true)}
function evidenceDetail(){let d=getD();modal('证据链与复算说明',`<div class="row">${tag('合成演示数据','amber')}${tag('描述性证据')}</div><div class="info-grid"><div><label>范围</label>${context()}</div><div><label>数据版本</label>demo_20260916_v1</div><div><label>当前 / 对比金额</label>${money(d.pay)} / ${money(d.prev)} 万元</div><div><label>变化贡献</label>晚间 72% + 午间 18% + 其他 10% = 100%</div></div><h3 class="section-gap">复算公式</h3><pre>环比 = (当前金额 - 对比金额) / 对比金额\n差额 = ${d.pay.toFixed(2)} - ${d.prev.toFixed(2)} = ${(-d.delta).toFixed(2)} 万元\n晚间贡献 = 晚间金额差额 / 全部金额差额 = 72%</pre><h3>建议查询草稿（未执行）</h3><pre>SELECT payment_date, time_bucket,\n       SUM(paid_amount) AS paid_amount\nFROM authorized_trade_view\nWHERE payment_date BETWEEN :start_date AND :end_date\n  AND business_category = :category\nGROUP BY payment_date, time_bucket;</pre><p class="note">资产名、字段及查询均为设计草稿。真实执行前需映射语义层、校验授权与扫描预算。规模分解不能证明策略增量。</p>`, `<button class="primary" onclick="closeModal()">返回分析</button>`,true)}
function assetDetail(i){modal(['交易主题宽表','商家成长特征','核销与退款事件','实验分流日志'][i],`<div class="row">${tag(i===3?'待对接':'合成演示资产',i===3?'amber':'purple')}</div><p class="section-gap">建议由数据平台提供${['订单支付事实与退款关联','商家生命周期及经营强度特征','券粒度核销、撤销及退款事件','实验随机分配与观测日志'][i]}，当前未连接生产系统。</p><div class="info-grid"><div><label>负责人</label>数据平台负责人（待指定）</div><div><label>权限</label>按地域与业务域授权，敏感标识默认脱敏</div></div><p class="note">版本变更需通知下游报告与分析任务，并保留旧快照以便复算。</p>`)}
function pipeline(){modal('新建数据任务 · 方案预览',`<div class="formgrid"><div><label>任务名称</label><input id="pipeName" value="餐饮交易主题加工"></div><div><label>运行频率</label><select><option>每日 08:00（示例）</option><option>手动运行</option></select></div></div><div class="steps"><div class="step done"><b>提取</b>授权主题资产</div><div class="step done"><b>加工</b>订单去重 / 门店映射</div><div class="step done"><b>校验</b>完整性 / 对账</div><div class="step"><b>发布</b>数据负责人审核</div></div><p class="note">本次仅下载任务配置草稿，不创建真实调度。生产接入后支持失败重试、补数、幂等写入及版本回滚。</p>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="download('数据任务草稿.json',JSON.stringify({name:document.getElementById('pipeName').value,status:'draft_demo',steps:['提取','加工','校验','人工评审']},null,2),'application/json');closeModal()">下载配置草稿</button>`)}
function newProject(){modal('新建专题分析',`<div><label>专题名称</label><input class="full" id="projectName" value="${esc(S.city)}餐饮晚间交易下滑分析"></div><div class="section-gap"><label>业务问题</label><textarea id="projectQuestion">支付金额下降主要发生在哪些时段与商家？如何通过补齐供给或优化运营恢复有效核销？</textarea></div><div class="formgrid section-gap"><div><label>负责人</label><input id="projectOwner" value="我 · 分析师" required></div><div><label>复盘日期</label><input id="projectDate" type="date" value="2026-09-30"></div></div><p class="note">将保留当前筛选范围与演示证据快照。${S.project?'已有本地专题，保存会替换当前演示专题。':'生产版支持多人协作和多个专题，本原型保留一个自建专题。'}</p>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveProject()">创建专题</button>`)}
function saveProject(){let name=document.getElementById('projectName').value.trim(),owner=document.getElementById('projectOwner').value.trim(),date=document.getElementById('projectDate').value,question=document.getElementById('projectQuestion').value.trim();if(!name||!owner||!date||!question){toast('请填写名称、问题、负责人和复盘日期');return}S.project={name,owner,date,question,scope:context(),snapshot:getD(),checks:[false,false,false],strategy:'优先补齐晚间供给与曝光证据，再在匹配门店中设计策略验证。',review:''};S.report=false;S.reviewed=false;persist();closeModal();go('projects');toast('专题已保存到本地演示工作区')}
function projectDetail(){if(!S.project){newProject();return}modal('策略与复盘计划',`<h3>${esc(S.project.name)}</h3><p class="subtitle">${esc(S.project.scope)}</p><div class="section-gap"><label>拟采取的行动与验证方法</label><textarea id="strategyText">${esc(S.project.strategy)}</textarea></div><div class="formgrid section-gap"><div><label>负责人</label><input id="strategyOwner" value="${esc(S.project.owner)}"></div><div><label>复盘日期</label><input type="date" id="strategyDate" value="${esc(S.project.date)}"></div></div><p class="note">该行动不会自动向商家下发，不启动真实运营策略。</p>`,`<button class="primary" onclick="saveStrategy()">保存行动项</button>`)}
function saveStrategy(){let strategy=document.getElementById('strategyText').value.trim(),owner=document.getElementById('strategyOwner').value.trim(),date=document.getElementById('strategyDate').value;if(!strategy||!owner||!date){toast('请补齐行动、负责人和日期');return}Object.assign(S.project,{strategy,owner,date});S.report=false;S.reviewed=false;persist();closeModal();render();toast('行动项已保存；相关报告需重新生成')}
function makeReport(){if(!S.quality){toast('数据质量未通过，暂不能生成报告');return}if(!S.project){toast('请先创建专题，以保留问题与证据范围');newProject();return}S.report=true;S.reviewed=false;persist();if(route==='reports')reportPreview();else{window.addEventListener('hashchange',()=>reportPreview(),{once:true});go('reports')}}
function reportHTML(){let d=S.project.snapshot;return `<article class="reportbody"><span class="tag amber">演示数据 · 非业务实测结论</span><h2 style="margin-top:14px">${esc(S.project.name)}</h2><p>${esc(S.project.scope)} · demo_20260916_v1</p><h3>1. 业务问题</h3><p>${esc(S.project.question)}</p><h3>2. 主要发现与证据</h3><p>支付金额从 ${money(d.prev)} 万元降至 ${money(d.pay)} 万元，下降 10.4%。互斥时段中，晚间贡献总下降金额的72%。以上均为合成示例数据。</p><h3>3. 解释边界</h3><p>此处是描述性贡献，不是因果效应。需要补齐流量、供给、活动与补贴证据；尚不能宣称策略有效。</p><h3>4. 行动与验证</h3><p>${esc(S.project.strategy)}</p><p>负责人：${esc(S.project.owner)}；复盘日期：${esc(S.project.date)}。结果指标建议为核销收益，护栏包括退款、投诉与成本，具体口径待确认。</p><h3>5. 复盘记录</h3><p>${esc(S.project.review||'尚未执行策略，无真实效果。后续记录观察窗口、对照组、实际变化与迭代决策。')}</p></article>`}
function exportReport(){download('观澜AI-专题报告.html','<!doctype html><meta charset="utf-8"><title>观澜AI专题报告</title><style>body{font:16px/1.9 sans-serif;max-width:900px;margin:50px auto;padding:25px}h2,h3{color:#6546ad}.tag{color:#a87920}</style>'+reportHTML(),'text/html')}
function reportPreview(){if(!S.report||!S.project){makeReport();return}modal('专题报告 · 本地草稿',reportHTML()+`<div class="checklist"><label><input type="checkbox" id="reviewCheck" ${S.reviewed?'checked':''} onchange="S.reviewed=this.checked;persist()">我已核对本地示例的证据、口径及结论边界</label></div>`,`<button onclick="exportReport()">${ic('download')} 导出 HTML</button><button class="primary" onclick="archiveMethod()">沉淀为方法资产</button>`,true)}
function archiveMethod(){if(!S.reviewed){toast('请先核对并勾选评审项');return}S.savedAsset=true;persist();closeModal();go('library');toast('方法已归档到本地能力库，未发布到团队系统')}
function scheduleModal(){modal('经营周报 · 自动化配置',`<div class="formgrid"><div><label>报告模板</label><select><option>商家 / 交易 / 生态经营周报</option></select></div><div><label>生成时间</label><input value="每周一 09:00 · Asia/Shanghai" readonly></div></div><div class="checklist"><label><input type="checkbox" checked disabled>质量检查失败时暂停生成</label><label><input type="checkbox" checked disabled>生成后进入分析师审核</label></div><p class="note">保存仅保留原型配置，不会自动唤醒任务或发送消息。真实调度与收件范围需后续对接。</p>`,`<button class="primary" onclick="S.schedule=true;persist();closeModal();render();toast('周报配置已本地保存，尚未启用真实调度')">保存演示配置</button>`)}
function reviewModal(){if(!S.project){toast('请先创建专题');newProject();return}modal('策略复盘记录',`<label>实际结果、证据限制和下一步</label><textarea id="reviewText" placeholder="记录策略是否执行、观察窗、指标与护栏、验证方法和下一轮决策">${esc(S.project.review)}</textarea><p class="note">没有实际观测数据时，不填写推测的收益数字。</p>`,`<button class="primary" onclick="S.project.review=document.getElementById('reviewText').value;S.report=false;S.reviewed=false;persist();closeModal();render();toast('复盘已保存，请重新生成报告以同步记录')">保存复盘</button>`)}
function experimentPlan(){modal('实验方案草稿',`<div class="callout">假设：补齐晚间可售供给能够提升门店核销收益，同时不增加退款、投诉和不可接受的运营成本。</div><div class="info-grid"><div><label>随机化单元</label>门店；商圈干扰明显时改用商圈簇</div><div><label>分组方案</label>按规模、城市、行业分层随机</div><div><label>评估方法</label>随机单元聚合效应与区间</div><div><label>前置要求</label>基线方差、MDE、样本与护栏待确认</div></div><p class="note">实验仅设计不投放；样本比例异常、指标未成熟或护栏恶化时，不能直接建议全量。</p>`,`<button class="primary" onclick="download('实验方案草稿.txt','演示方案：晚间供给补齐。随机单元：门店或商圈簇。主指标：增量核销收益。护栏：退款、投诉、成本。基线、MDE、样本、观察窗、停止规则待确认。未投放真实实验。','text/plain')">下载方案草稿</button>`)}
function searchModal(){modal('快速前往',`<label>搜索功能或分析场景</label><input class="full" id="quickSearch" placeholder="输入：诊断、报告、实验…" oninput="document.getElementById('searchResults').innerHTML=searchResults(this.value)"><div id="searchResults" class="stack section-gap">${searchResults('')}</div>`)}
function searchResults(q){let a=pages.filter(p=>p[2].includes(q));return a.length?a.map(p=>`<button style="justify-content:flex-start" onclick="closeModal();go('${p[0]}')">${ic(p[1])}${p[2]}</button>`).join(''):'<p class="muted">没有匹配入口，试试“诊断”或“报告”。</p>'}
function settings(){modal('演示工作区设置',`<p>当前身份：分析师。生产设计采用业务域、地域、行列权限与审计控制。本原型未连接生产权限系统。</p><div class="evidence">自建专题、行动项、周报配置与评审状态仅保存在当前浏览器；更换浏览器不会同步。</div>`,`<button onclick="modal('重置演示数据','<p>将清除本浏览器的自建专题、报告和配置。下载过的文件不受影响。</p>',\`<button onclick=\"closeModal()\">取消</button><button class=\"primary\" onclick=\"S={...initial};persist();closeModal();render();toast('已重置本地演示')\">确认重置</button>\`)">重置演示</button><button class="primary" onclick="closeModal()">完成</button>`)}
function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type:type+';charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成本地下载文件')}
async function exportCurrent(){try{toast('正在通过本地服务生成界面截图…');let src=location.pathname+'?embed=1&state='+(['projects','reports'].includes(route)?'filled':route==='diagnosis'&&S.diagnosed?'complete':'default')+'#'+route;let result=await window.snapshotPrototypeViaServer(src,{viewport:{width:1440,height:1100}});let a=document.createElement('a');a.href=result.dataUrl;a.download='观澜AI-标准示例-'+route+'.png';a.click();toast('标准示例界面已导出；本地编辑与临时弹窗不包含在内')}catch(e){toast('截图失败：'+e.message)}}
function render(){let p=pages.find(p=>p[0]===route)||pages[0];route=p[0];document.title=p[2]+' · 观澜 AI';document.getElementById('app').innerHTML=`<div class="screen" id="${route}" style="min-height:100vh"><aside class="sidebar"><a class="brand" href="#overview"><div class="mark">≈</div><div><b>观澜 AI</b><small>LIFE INSIGHT</small></div></a><div class="workspace between"><span>生活服务 · 分析团队</span><span class="muted">⌄</span></div><div class="nav-label">分析工作空间</div>${pages.map((x,i)=>`${i===6?'<div class="nav-label">决策与资产</div>':''}<a href="#${x[0]}" class="nav-item ${route===x[0]?'active':''}" ${route===x[0]?'aria-current="page"':''}>${ic(x[1])}<span class="nav-text">${x[2]}</span>${x[0]==='diagnosis'?'<span class="nav-count">3</span>':''}</a>`).join('')}<div class="side-bottom"><div class="side-card"><div class="row" style="gap:6px;color:var(--p)">${ic('spark')} 从问题到行动</div><p style="margin-top:6px;color:#9290a5">每一次分析，都成为下一次的起点。</p></div><div class="row"><div class="avatar">析</div><div><b class="small">我的工作区</b><div class="muted" style="font-size:10px">分析师 · 本地演示</div></div><button class="quiet" aria-label="工作区设置" onclick="settings()" style="margin-left:auto;padding:0">${ic('gear')}</button></div></div></aside><div class="shell"><header class="topbar"><div class="row"><b class="small">${p[2]}</b><span class="muted small"> / </span><span class="tag purple">演示工作区</span></div><div class="row"><button class="searchbutton" onclick="searchModal()">${ic('search')} 搜索功能、分析场景<kbd>Ctrl K</kbd></button><span class="small muted topstatus"><i class="dot" style="background:${S.quality?'#31b396':'#d85b65'}"></i> ${S.quality?'演示数据就绪':'数据质量阻断'}</span><button class="quiet" aria-label="查看任务动态" onclick="modal('任务动态','<p>数据快照：演示数据已准备。</p><p>诊断、项目与报告动态保留在本浏览器，无外部通知。</p>')">${ic('bell')}</button></div></header><main class="main" id="screen">${({overview,data:dataPage,chat:chatPage,diagnosis,projects,models,experiments,reports,library}[route])()}<div class="footnote"><span>观澜 AI · 面向抖音生活服务分析师的概念设计，非官方产品</span><span class="row"><button class="quiet small" onclick="exportCurrent()">导出标准示例界面</button>所有业务数字为演示数据 · V1.0</span></div></main></div><div id="overlay"></div></div>`}
if(new URLSearchParams(location.search).has('tiled')){document.getElementById('app').innerHTML='<div class="tilegrid">'+pages.map(p=>`<section><h2>${p[2]}</h2><iframe title="${p[2]}" src="?embed=1#${p[0]}"></iframe></section>`).join('')+'</div>'}else render();
</script><script src="../../scripts/prototype-export-client.js"></script></body></html>
